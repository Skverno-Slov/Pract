[versions]
agp = "9.0.1"
converterGsonVersion = "3.0.0"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.0.21"
composeBom = "2024.09.00"
loggingInterceptor = "5.3.2"
navigationCompose = "2.9.8"
okhttp = "5.3.2"
retrofit = "3.0.0"
roomKtx = "2.8.4"
securityCrypto = "1.1.0"
vico = "2.0.0"

[libraries]
vico_core = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }
vico_compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
